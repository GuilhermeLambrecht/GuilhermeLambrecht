name: Cartões do perfil

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/perfil.yml"

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar estatísticas, linguagens, projetos e contribuições
        run: node scripts/cards.mjs
        env:
          # PROFILE_TOKEN (opcional): token pessoal com escopo read:user para incluir contribuições privadas.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          GH_USER: ${{ github.repository_owner }}

      - name: Publicar no branch output
        working-directory: dist
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Atualiza cartões do perfil"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
